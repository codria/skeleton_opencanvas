camera:
  device_index: 0
  width: 1280
  height: 720
  fps: 30

display:
  width: 1280
  height: 720
  # 時系列グラフ（右上）を有効化するか。重い環境（ノート PC 等）で false にすると
  # グラフ widget が生成されず、関連処理も全部スキップされる。
  graph_enabled: true

pose:
  num_poses: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  model_path: "assets/models/pose_landmarker.task"
  # ランドマーク平滑化（指数移動平均）の追従係数。1.0=平滑化なし、小さいほど滑らか
  smoothing_alpha: 0.25
  # true にすると、内部的に多めに検出してから画面中央（NOSE 基準）に近い順に
  # 並べ替えて num_poses に絞る。外縁部にちらっと写った人物を優先されないように。
  center_priority: true

assets:
  # Mode2 / Mode3 共通のキャラクターモデル（GLTF）。
  # ディレクトリパスの場合は配下の BlockMan.gltf を自動で解決する。
  character_model: "assets/characters/BlockMan.gltf"

mode2:
  background_image: "assets/backgrounds/default.jpg"

mode3:
  rotation_speed: 30.0   # 視点の自動回転速度（度/秒）
